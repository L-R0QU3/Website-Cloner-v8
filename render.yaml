services:
  - type: web
    name: website-cloner
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_USER
        sync: false      # lo escribes tú en el panel de Render
      - key: APP_PASSWORD
        sync: false      # lo escribes tú en el panel de Render
